apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgt-app
  labels:
    app: kgt-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kgt-app
  template:
    metadata:
      labels:
        app: kgt-app
    spec:
      containers:
      - name: kgt-app
        image: 774941661781.dkr.ecr.eu-west-3.amazonaws.com/kgt-app:v1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
