title: "KGT Cloud Formation"
description: "Formation DevOps Cloud multi-cloud — AWS · GCP · Azure"
theme: just-the-docs

url: "https://mthiam574.github.io"
baseurl: "/kgt-cloud-formation"

# Auteur
author:
  name: "Moustapha THIAM"
  email: ""

# Just the Docs — options
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
permalink: pretty
aux_links:
  "GitHub ↗":
    - "https://github.com/mthiam574/kgt-cloud-formation"
aux_links_new_tab: true

nav_sort: order   # tri par nav_order dans le front matter

footer_content: "Moustapha THIAM · Admin sys en formation DevOps Cloud · 2024–2025"
back_to_top: true
back_to_top_text: "Haut de page"

# Plugins GitHub Pages compatibles
plugins:
  - jekyll-seo-tag

# Exclusions
exclude:
  - PHASES/
  - TERRAFORM/
  - SCRIPTS/
  - DIAGRAMS/
  - "*.sh"
  - Gemfile.lock
  - README.md
